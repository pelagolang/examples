name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Pelago has no binary releases yet, so build the tool from the main repository.
      - name: Install pelago
        run: cargo install --git https://github.com/pelagolang/pelago --locked pelago
      - run: pelago fmt --check .
      - run: pelago check .

  run:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pelago
        run: cargo install --git https://github.com/pelagolang/pelago --locked pelago
      - name: Run in the interpreter
        run: pelago run . | diff - expected.txt
      - name: Build the native executable and run it
        run: |
          pelago build -o rpn .
          ./rpn | diff - expected.txt
